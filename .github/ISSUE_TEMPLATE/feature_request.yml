name: Feature request
description: Suggest an improvement to the AETHER skill
labels: ['enhancement']
body:
  - type: textarea
    id: goal
    attributes:
      label: Visual/design task
      description: What user-visible outcome should improve?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior and constraints
      description: Include only references that can legally be reused.
